[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fontpair-ingest"
version = "0.1.0"
description = "Font corpus ingestion and feature extraction for Font Pairing Engine"
requires-python = ">=3.9"
dependencies = [
    "fonttools[woff,unicode]>=4.50",
    "brotli",
    "numpy>=1.26",
    "httpx>=0.27",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fontpair-ingest = "fontpair_ingest.pipeline:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fontpair_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
